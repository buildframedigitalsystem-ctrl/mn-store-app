<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M&N Partner Store Signup</title>

    <link rel="stylesheet" href="assets/css/store-auth.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-brand">

                <img src="images/branding/mn-logo.png" alt="M&N Logo">

                <h1>M&N Partner Store</h1>

                <p>
                    Register your store to access wholesale ordering,
                    deliveries, invoices, balances, and partner pricing.
                </p>

            </div>

            <form id="storeSignupForm" class="auth-form">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Store Name *</label>

                        <input type="text" id="storeName" required>
                    </div>

                    <div class="form-group">
                        <label>Owner Name *</label>

                        <input type="text" id="ownerName" required>
                    </div>

                    <div class="form-group">
                        <label>Mobile Number *</label>

                        <input type="text" id="contactNumber" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Store Address *</label>

                        <textarea id="address" required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Email Address (Optional)</label>

                        <input type="email" id="email">
                    </div>

                    <div class="form-group">
                        <label>Username *</label>

                        <input type="text" id="username" required>
                    </div>

                    <div class="form-group">
                        <label>Password *</label>

                        <input type="number" id="password" required>

                    </div>

                    <button type="submit" class="auth-btn">

                        Register Partner Store

                    </button>

                    <div class="auth-footer">

                        Already registered?

                        <a href="store-login.html">
                            Login here
                        </a>

                    </div>

            </form>

        </div>

    </div>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/store-auth.js"></script>
    <script src="assets/js/store-session.js"></script>

</body>

</html>
