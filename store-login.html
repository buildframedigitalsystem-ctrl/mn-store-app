<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M&N Partner Store Login</title>

    <link rel="stylesheet" href="assets/css/store-auth.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-card small-auth-card">

            <div class="auth-brand">

                <img src="images/branding/mn-logo.png" alt="M&N Logo">

                <h1>Store Partner Login</h1>

                <p>
                    Login to access your orders,
                    balances, deliveries, and partner dashboard.
                </p>

            </div>

            <form id="storeLoginForm" class="auth-form">

                <div class="form-group">
                    <label>Username *</label>

                    <input type="text" id="loginUsername" required>
                </div>

                <div class="form-group">
                    <label>Password *</label>

                    <input type="number" id="loginPassword" required>

                    <button type="submit" class="auth-btn">

                        Login to Store Portal

                    </button>

                    <div class="auth-footer">

                        No account yet?

                        <a href="store-signup.html">
                            Register here
                        </a>

                    </div>

            </form>

        </div>

    </div>

    <script src="assets/js/api-config.js"></script>

    <script src="assets/js/store-auth.js"></script>

</body>

</html>
