<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&N Cart</title>

    <link rel="stylesheet" href="assets/css/store.css">
    <link rel="stylesheet" href="assets/css/responsive-fixes.css">

    <link rel="manifest" href="manifest-store.json">
    <meta name="theme-color" content="#005f2f">
</head>

<body>

    <section class="cart-page">

        <div class="cart-header">
            <div>
                <h1>🛒 Shopping Cart</h1>
                <p>Review your selected products before checkout.</p>
            </div>

            <div class="cart-header-actions">
                <a href="wholesale.html" class="continue-shopping-btn">
                    ← Continue Shopping
                </a>
            </div>
        </div>

        <div class="cart-layout">

            <div class="cart-items-section">
                <div id="cartItemsContainer">
                    <div class="empty-cart">
                        Cart is empty.
                    </div>
                </div>
            </div>

            <div class="checkout-section">
                <div class="checkout-card">

                    <h2>Order Summary</h2>

                    <div class="summary-row">
                        <span>Items</span>
                        <strong id="cartItemCount">0</strong>
                    </div>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <strong id="cartSubtotal">₱0.00</strong>
                    </div>

                    <div class="summary-row total-row">
                        <span>Total</span>
                        <strong id="cartTotal">₱0.00</strong>
                    </div>

                    <hr>

                    <hr>

                    <button type="button" class="remove-cart-btn" onclick="clearCart_()"
                        style="width:100%;margin-bottom:12px;">
                        🗑️ Clear Entire Cart
                    </button>

                    <a href="store-order-form.html" class="checkout-btn">
                        Proceed to Checkout
                    </a>

                    <p class="cart-helper-text">
                        You will review your order, add notes, sign, and submit on the final checkout form.
                    </p>

                </div>
            </div>

        </div>

    </section>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/store-session.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/universal-search.js"></script>

</body>

</html>
